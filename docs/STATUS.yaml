forecasting_track:
  contract:
    response_shape: |
      {"probabilities": [{"market": "<outcome label>", "probability": <0..1>}, ...]}
    actuals_shape: '{"market_ticker": "<winner label string>"}'
    binary_yes_condition_deprecated: "old docs said {p_yes, rationale}; that is wrong as of 2026-05-16"
    submission_mechanism: "endpoint-only; /forecast/endpoints/register; no upload path"
    sla: "10 minutes per event"

  variants_in_forecast_track_py:
    - name: uniform_prior
      description: "deterministic 1/len(outcomes)"
      cost_per_event_usd: 0.0
    - name: single_llm
      description: "one Sonnet 4.6 call; emits binary p_yes for outcomes[0]"
      cost_per_event_usd: 0.005
    - name: opus_47
      description: "one Opus 4.7 call"
      cost_per_event_usd: 0.015
    - name: opus_46
      description: "one Opus 4.6 call; leaderboard top agent reference"
      cost_per_event_usd: 0.015
    - name: gpt55
      description: "one GPT-5.5 call (cross-vendor)"
      cost_per_event_usd: 0.010
    - name: gpt52
      description: "one GPT-5.2 call; leaderboard top OpenAI fixed-context"
      cost_per_event_usd: 0.010
    - name: ensemble_logit
      description: "Sonnet 4.6 + GPT-5.5, logit-mean blend"
      cost_per_event_usd: 0.015
    - name: ensemble_leaderboard
      description: "Sonnet 4.6 + Opus 4.6 + GPT-5.2, logit-mean three-way"
      cost_per_event_usd: 0.025
    - name: sonnet_cot
      description: "Sonnet 4.6 with structured CoT JSON prompt"
      cost_per_event_usd: 0.007
    - name: sonnet_cot_shrink
      description: "sonnet_cot + post-hoc shrinkage to prior"
      cost_per_event_usd: 0.007
    - name: multi_outcome
      description: "ONE Sonnet 4.6 call returns per-outcome probabilities"
      cost_per_event_usd: 0.010
      currently_in_production: true
    - name: multi_outcome_sc3
      description: "k=3 parallel multi_outcome calls, averaged per-outcome (self-consistency)"
      cost_per_event_usd: 0.030
      status: "subagent built it; not yet promoted to production"

  brier_baseline_sample_resolved:
    n_events: 26
    note: |
      Two scoring conventions in use. Legacy backtest uses binary p_yes vs
      binary 1/0 actual (single_llm winner). Proper per-outcome Brier uses
      sum((p_i - 1[outcome_i==winner])^2) across all outcomes per event
      (multi_outcome winner). Standard error on n=26 is ~0.05-0.10 so deltas
      below that are within noise.
    legacy_p_yes_brier:
      uniform_prior: 0.219
      single_llm: 0.193
      opus_47: 0.230
      opus_46: 0.237
      gpt55: 0.198
      gpt52: 0.203
      ensemble_logit: 0.193
      ensemble_leaderboard: 0.208
      sonnet_cot: 0.207
      sonnet_cot_shrink: 0.194
      multi_outcome: 0.211
    proper_per_outcome_brier:
      single_llm_distributed: 0.6742
      multi_outcome_direct: 0.6510  # +0.0232 better; within SE but architecturally correct

