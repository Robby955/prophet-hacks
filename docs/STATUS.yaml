traps_to_avoid:
  - "DO NOT add KALSHI_API_KEY anywhere. Prophet Hacks goes through Prophet Arena's own API. Kalshi tickers in the data are just identifiers."
  - "Trading-track patterns (BenchmarkSession tick loop) are NOT for the forecasting submission. They're parallel work for a separate track."
  - "Module-level caches in forecast_track.py and forecaster.py read config once at import. Restart the process after editing config to see model changes."
  - "Outcomes lists vary 2..30. Don't assume binary 2-outcome shape — `predict_uniform_prior` handles this; new variants must too."

