last_actor: claude-opus-4-7
event:
  name: "Prophet Hacks"
  kickoff_ct: "2026-05-16T09:00:00-05:00"
  duration_hours: 24
  primary_track: "forecasting"
  notes_on_track: |
    Forecasting is `prophet forecast {register,events,predict,evaluate,
    retrieve,leaderboard}`. Scoring is Brier per
    ai_prophet_core.forecast.evaluate. Trading-track scaffolding still
    lives in agent.py/risk.py and remains useful as a portfolio artifact
    but is NOT the submission target.

repo:
  remote: "git@github.com:Robby955/prophet-hacks.git"
  branch: "main"
  head_commit: "aeba874"
  privacy: "private (flip public after Rob review post-event)"
  pushed: true

forecasting_track:
  contract:
    predict_signature: "predict(event: dict) -> {p_yes: float in [0.01, 0.99], rationale: str}"
    submission_shape: |
      {
        "timestamp": "ISO 8601",
        "predictions": [{"market_ticker": str, "p_yes": float, "rationale": str}, ...]
      }
    actuals_shape: '{"market_ticker": 1.0 | 0.0, ...}'
    binary_yes_condition: "resolved_outcome.value == [outcomes[0]]"

  current_variants:
    - name: "uniform_prior"
      module: "forecast_track:predict_uniform_prior"
      brier_sample_resolved: 0.219
      cost_per_event_usd: 0.0
      notes: "Deterministic 1/len(outcomes). Free control baseline."
    - name: "single_llm"
      module: "forecast_track:predict_single_llm"
      model: "claude-sonnet-4-6"
      brier_sample_resolved: 0.190
      cost_per_event_usd: 0.005
      wall_time_per_event_sec: 3.7
      notes: "Single Anthropic call per event with JSON-parse fallback chain."

  reference_brier:
    random_05: 0.250
    perfect: 0.000
    sample_n_events: 26
    sample_yes_count: 12
    sample_no_count: 14
    sample_categories: {Sports: 16, Entertainment: 4, Elections: 3, Politics: 3}

