forecasting_track:
  contract:
    response_shape: |
      {"probabilities": [{"market": "<outcome label>", "probability": <0..1>}, ...]}
    actuals_shape: '{"market_ticker": "<winner label string>"}'
    old_binary_shape: "{p_yes, rationale} is legacy; the live endpoint converts legacy variants to probabilities"
    submission_mechanism: "endpoint-only via /forecast/endpoints/register"
    sla: "10 minutes per event"

  production_pipeline:
    variant: "multi_outcome_retrieval"
    steps:
      - "Build one Brave Search query from event title plus the most informative outcome"
      - "Fetch up to 5 web results"
      - "Dedupe by domain; prefer .gov, .edu, exchanges, and major news"
      - "Prompt Claude Sonnet 4.6 for per-outcome probabilities"
      - "Apply Kalshi longshot guard: floor at max(0.05, 0.5 / n_outcomes)"
      - "Return Prophet Arena probabilities list"
    graceful_degradation:
      - "If BRAVE_SEARCH_API_KEY is missing or Brave fails, fall back to multi_outcome"
      - "If the LLM call fails, fall back to uniform prior"

  variants_in_forecast_track_py:
    - name: uniform_prior
      description: "deterministic 1/len(outcomes)"
      cost_per_event_usd: 0.0
    - name: single_llm
      description: "one Sonnet 4.6 call; emits legacy binary p_yes"
      cost_per_event_usd: 0.005
    - name: opus_47
      description: "one Opus 4.7 call"
      cost_per_event_usd: 0.015
    - name: opus_46
      description: "one Opus 4.6 call"
      cost_per_event_usd: 0.015
    - name: gpt55
      description: "one GPT-5.5 call"
      cost_per_event_usd: 0.010
    - name: gpt52
      description: "one GPT-5.2 call"
      cost_per_event_usd: 0.010
    - name: ensemble_logit
      description: "Sonnet 4.6 + GPT-5.5, logit-mean blend"
      cost_per_event_usd: 0.015
    - name: ensemble_leaderboard
      description: "Sonnet 4.6 + Opus 4.6 + GPT-5.2, logit-mean blend"
      cost_per_event_usd: 0.025
    - name: sonnet_cot
      description: "Sonnet 4.6 structured prompt experiment"
      cost_per_event_usd: 0.007
    - name: sonnet_cot_shrink
      description: "sonnet_cot plus post-hoc shrinkage to prior"
      cost_per_event_usd: 0.007
    - name: multi_outcome
      description: "one Sonnet 4.6 call returns per-outcome probabilities"
      cost_per_event_usd: 0.010
    - name: multi_outcome_sc3
      description: "k=3 parallel multi_outcome calls, averaged per outcome"
      cost_per_event_usd: 0.030
    - name: multi_outcome_retrieval
      description: "Brave Search evidence plus multi_outcome prompt plus Kalshi guard"
      cost_per_event_usd: 0.012
      currently_in_production: true
    - name: hybrid_routed
      description: "binary routes to gpt55; multi-outcome routes to multi_outcome"
      cost_per_event_usd: 0.008

  brier_baseline_sample_resolved:
    n_events: 26
    caution: "retrieval on resolved historical events can leak through web search"
    legacy_p_yes_brier:
      random_0_5: 0.250
