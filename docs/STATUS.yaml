forecasting_track:
  contract:
    response_shape: |
      {"probabilities": [{"market": "<outcome label>", "probability": <0..1>}, ...]}
    actuals_shape: '{"market_ticker": "<winner label string>"}'
    old_binary_shape: "{p_yes, rationale} is legacy; the live endpoint converts legacy variants to probabilities"
    submission_mechanism: "endpoint-only via /forecast/endpoints/register"
    sla: "10 minutes per event"

  production_pipeline:
    variant: "multi_outcome_retrieval"
    steps:
      - "Build one Brave Search query from event title plus the most informative outcome"
      - "Fetch up to 5 web results"
      - "Dedupe by domain; prefer .gov, .edu, exchanges, and major news"
      - "Prompt Claude Opus 4.7 for per-outcome probabilities"
      - "Apply Kalshi longshot guard: floor at min(0.10, max(0.05, 0.5 / n_outcomes))"
      - "Return Prophet Arena probabilities list"
    graceful_degradation:
      - "If BRAVE_SEARCH_API_KEY is missing or Brave fails, fall back to multi_outcome"
      - "If the LLM call fails, fall back to uniform prior"
    live_trace_fields:
      - "Brave query"
      - "evidence titles and URLs"
      - "raw model output"
      - "parse path"
      - "latency_ms"
      - "warnings"
      - "fallback path"

  current_backtest_context:
    n_events: 26
    caution: "retrieval on resolved historical events can leak through web search"
    current_headline: "multi_outcome_retrieval remains production; live PA calls are the next trigger"
    rejected_changes:
      - "self-critique prompt: first run improved, replication regressed; treated as noise"
      - "retrieval-count sweep: k=5 versus k=8 did not clear paired-bootstrap CI"
      - "source-priority sweep: not significant under PA single-binary metric"

